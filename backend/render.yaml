# Render Blueprint for Mama Joy's Cosmetics and Collections API.
#
# IMPORTANT: Persistent disks (used here for product photo storage) require a
# PAID instance type — they are not available on the free plan. This blueprint
# uses "starter" (~$7/month at time of writing) as the minimum instance that
# supports a disk. See: https://render.com/docs/disks
#
# From the Render Dashboard, choose "New > Blueprint" and point it at this repo.
databases:
  - name: mama-joys-cosmetics-db
    plan: free
    postgresMajorVersion: 16

services:
  - type: web
    name: mama-joys-cosmetics-api
    runtime: node
    plan: starter
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: product-images
      mountPath: /var/data/uploads
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: mama-joys-cosmetics-db
          property: connectionString
      - key: DB_SSL
        value: "true"
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_CALLBACK_URL
        sync: false
